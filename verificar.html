    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, k, b64(D.ct)); })
      .then(function (buf) {
        var html = new TextDecoder().decode(buf);
        function escribe() { document.open(); document.write(html); document.close(); }
        // si la página aún se está cargando, document.open() añadiría en vez de sustituir
        if (document.readyState === 'complete') escribe();
        else window.addEventListener('load', function () { setTimeout(escribe, 0); }, { once: true });
      });
  }
  function deriva(clave) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(D.sal), iterations: D.n, hash: 'SHA-256' }, k, 256);
      });
  }
  var H = null, f = document.getElementById('f'), h = document.getElementById('h');
  function entra() {
    h.hidden = true; f.hidden = false;
    var guardada = null;
    try { guardada = localStorage.getItem(K); } catch (e) { }
    if (guardada) {
      abre(b64(guardada)).catch(function () { try { localStorage.removeItem(K); } catch (e) { } });
    }
  }
  // Antes de pedir la contraseña: ¿hay clase ahora? Lo decide el registro con la hora de Google y el calendario de Classroom
  function cerrado(titulo, texto, reintentar) {

    if (reintentar) document.getElementById('r').onclick = compruebaHorario;
  }
  function compruebaHorario() {
    h.className = 'caja'; h.hidden = false; h.innerHTML = '<h1>Simulador BIOS/UEFI · SMX</h1><p>Comprobando el horario de clase…</p>';
    fetch(H.url + '?accion=ventana&modulos=' + encodeURIComponent(H.modulos.join(',')) + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok && d.abierta) return entra();
        if (d && d.ok) return cerrado('⏰ Fuera del horario de clase',
          'El simulador solo se abre durante las clases de ' + H.modulos.join(', ') + '. Vuelve a entrar en tu próxima clase.', false);
        throw new Error('respuesta');
      })
      .catch(function () {
        cerrado('Sin conexión con el registro', 'No se puede comprobar el horario de clase. Revisa la conexión a Internet.', true);
      });
  }
  if (H) compruebaHorario(); else entra();
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var b = document.getElementById('b'), e = document.getElementById('e');

    deriva(document.getElementById('c').value).then(function (raw) {
      return abre(raw).then(function () {
        try { localStorage.setItem(K, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (x) { }
      });
    }).catch(function () { b.disabled = false; e.textContent = 'Contraseña incorrecta.'; });
  });
})();
